[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "uuid-utils>=0.10",
  "pypdf>=5.1",
  "python-frontmatter>=1.1",
  "sentence-transformers>=3.3",
  "torch>=2.5",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "google-genai>=1.0",
  "groq>=0.13",
  "neo4j>=5.26",
  # M6.2. The file watcher's only new runtime dependency: a cross-platform
  # wrapper over inotify/FSEvents/ReadDirectoryChangesW, none of which have a
  # usable common API otherwise.
  "watchdog>=6.0",
  # Promoted from the dev extras, where it was only the test client. The
  # watcher is a long-running process that POSTs to the API, and stdlib
  # urllib would mean either blocking the event loop or hand-rolling a thread
  # pool around it.
  "httpx>=0.27",
  "python-multipart>=0.0.32",
  # M11.0. Argon2id, via the reference binding. Not bcrypt — its 72-byte input
  # truncation is a footgun nobody needs — and never a bare hash: SHA-family
  # functions are designed to be fast, which is the one property a password
  # hash must not have. `verify` is constant-time inside the library, which is
  # why nothing in this codebase compares a hash with `==`.
  "argon2-cffi>=23.1",
  # M11.2. AES-256-GCM, and it was already here transitively via `argon2-cffi`;
  # named explicitly because a transitive dependency is one somebody is free to
  # drop, and the encryption at rest would go with it.
  "cryptography>=44.0",
]

[project.scripts]
memoryos = "memoryos.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memoryos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "integration: requires a running Postgres",
  "graph: requires a running Neo4j",
  "slow: downloads and loads the real embedding model",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
