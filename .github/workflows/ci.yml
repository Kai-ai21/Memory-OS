name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memos
          POSTGRES_PASSWORD: memos
          POSTGRES_DB: memos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memos -d memos"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MEMOS_DATABASE_URL: postgresql+asyncpg://memos:memos@localhost:5432/memos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: psql "postgresql://memos:memos@localhost:5432/memos" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: ruff check .
      - run: mypy
      - run: pytest
