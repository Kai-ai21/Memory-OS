name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memos
          POSTGRES_PASSWORD: memos
          POSTGRES_DB: memos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memos -d memos"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Without this the `graph` tests skip, and a permanent skip is
      # indistinguishable from a passing test in the summary. The service is
      # what stops "Neo4j is optional" turning into "the graph is untested".
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/memoryos
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p memoryos 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
          --health-start-period 30s
    env:
      MEMOS_DATABASE_URL: postgresql+asyncpg://memos:memos@localhost:5432/memos
      MEMOS_NEO4J_URI: bolt://localhost:7687
      MEMOS_NEO4J_USER: neo4j
      MEMOS_NEO4J_PASSWORD: memoryos
      # Pinned so the cache step below and the code agree on where weights live.
      HF_HOME: ${{ github.workspace }}/var/hf
      MEMOS_HF_HOME: ${{ github.workspace }}/var/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup-python's own `cache:` input understands pip/pipenv/poetry, not uv, so the
      # dependency cache is keyed off uv.lock here instead.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --extra dev
      # The default test run excludes the `slow` marker, so nothing here loads
      # the model — but the cache is shared with the `slow-tests` job below.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/var/hf
          key: hf-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2
      # The initial migration creates the `vector` extension, so this is also
      # what installs it for the readiness check.
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      # Fails when the models and the migrations have drifted apart: `alembic
      # check` exits non-zero if autogenerate would produce a diff. Catching
      # that on the pull request that introduces it is far cheaper than
      # reconstructing the missing migration months later.
      - run: uv run alembic check
      # A downgrade that was never run is a downgrade that does not work. Last,
      # because it leaves the database empty.
      - run: uv run alembic downgrade base

  # The only job that loads the real embedding model. Separate, because it
  # downloads ~90MB and takes far longer than everything else — and because a
  # green suite that never checks the vectors mean anything is exactly the
  # failure this job exists to catch.
  slow-tests:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/var/hf
      MEMOS_HF_HOME: ${{ github.workspace }}/var/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/var/hf
          key: hf-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m slow

  # The frontend, and the check that its API types still match the API.
  #
  # The drift check is the point of this job. Hand-written API types go stale
  # silently, and this project has twice paid for "two places that must agree
  # with nothing checking" — the chunker against the model's window, and Settings
  # against the embedder's model name. Regenerating and diffing makes a backend
  # change that breaks the client fail here rather than at runtime.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --extra dev
      - run: cd web && npm ci

      # No database and no server: the schema comes from the app object, so this
      # runs anywhere.
      - name: Regenerate the API types
        run: make types
      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- web/src/api/schema.d.ts web/src/api/openapi.json; then
            echo
            echo "The generated API types do not match the API."
            echo "Run 'make types' and commit web/src/api/schema.d.ts and openapi.json."
            exit 1
          fi

      - run: cd web && npm run typecheck
      - run: cd web && npm run test -- --run
      - run: cd web && npm run build
