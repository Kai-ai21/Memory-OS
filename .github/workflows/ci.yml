name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memos
          POSTGRES_PASSWORD: memos
          POSTGRES_DB: memos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memos -d memos"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MEMOS_DATABASE_URL: postgresql+asyncpg://memos:memos@localhost:5432/memos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup-python's own `cache:` input understands pip/pipenv/poetry, not uv, so the
      # dependency cache is keyed off uv.lock here instead.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --extra dev
      - run: psql "postgresql://memos:memos@localhost:5432/memos" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
